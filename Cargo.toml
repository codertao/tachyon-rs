[workspace]
resolver = "2"
members = ["tachyon-core", "tachyon-server", "tachyon-bot", "tachyon-asset-viewer", "tachyon-music-player"]

# Moved here from tachyon-asset-viewer/Cargo.toml: Cargo only honours profiles at the workspace root.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
